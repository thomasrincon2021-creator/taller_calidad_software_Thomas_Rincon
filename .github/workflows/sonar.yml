name: SonarCloud

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  sonarcloud:
    name: Analizar calidad y cobertura
    runs-on: ubuntu-latest

    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Ejecutar pruebas y generar cobertura
        run: ./gradlew clean test jacocoTestReport

      - name: Verificar reporte de cobertura
        run: |
          echo "=== BUSCANDO REPORTE JACOCO ==="
          find build -name "jacocoTestReport.xml" -type f -print
          echo "=== ARCHIVOS DE LA CARPETA ==="
          ls -R build/reports/jacoco/test/

      - name: Analizar con SonarCloud
        uses: SonarSource/sonarqube-scan-action@v6
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io